name: Windows ZIP startup smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published desktop version, without v (for example 0.1.1)'
        required: true
        type: string
        default: '0.1.1'
      sha256:
        description: 'Reviewed SHA256 of the published Windows ZIP (64 hexadecimal characters)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  startup:
    name: Published ZIP startup on Windows
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out smoke script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Verify and launch published Windows ZIP
        env:
          JOHAP_SMOKE_VERSION: ${{ inputs.version }}
          JOHAP_SMOKE_SHA256: ${{ inputs.sha256 }}
        run: >-
          & ./.github/scripts/windows-startup-smoke.ps1
          -Version $env:JOHAP_SMOKE_VERSION
          -ExpectedSha256 $env:JOHAP_SMOKE_SHA256

      - name: Stop only the test-owned process tree
        if: always()
        run: '& ./.github/scripts/windows-startup-smoke.ps1 -CleanupOnly'

      - name: Retain startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: johap-windows-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/johap-smoke-evidence/desktop.log
            ${{ runner.temp }}/johap-smoke-evidence/summary.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
